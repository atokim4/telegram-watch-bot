[project]
name = "telegram-watch-bot"
version = "0.1.0"
description = "Telegram bot that watches RSS/Atom feeds, web pages and JSON APIs and alerts on new matching items, with an optional Claude relevance filter."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sunnatulla E." }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram==3.31.0",
    "aiosqlite==0.22.1",
    "anthropic==2.6.0",
    "feedparser==6.0.14",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.16.2",
    "selectolax==1.0.2",
]

[project.scripts]
tgwatch = "tgwatch.cli:main"

[dependency-groups]
dev = [
    "aiohttp==3.14.5",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgwatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "N", "C4", "PT", "RET"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["feedparser"]
ignore_missing_imports = true
